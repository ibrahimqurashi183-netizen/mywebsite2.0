<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Gamer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#000);
    color:white;
    text-align:center;
}

header{
    padding:30px;
    background:#111;
    box-shadow:0 0 20px cyan;
}

h1{
    color:cyan;
    font-size:50px;
    text-shadow:0 0 20px cyan;
}

p{
    color:#ccc;
    margin-top:10px;
}

.hero{
    padding:80px 20px;
}

.hero h2{
    font-size:40px;
    color:#00ff99;
}

.hero button{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:cyan;
    color:black;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.hero button:hover{
    background:#00ff99;
    transform:scale(1.1);
    box-shadow:0 0 20px #00ff99;
}

.cards{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    width:250px;
    background:#222;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 15px cyan;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 25px #00ff99;
}

footer{
    padding:20px;
    background:#111;
    margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>🎮 OG GAMER</h1>
<p>Welcome to the Ultimate Gaming Website</p>
</header>

<section class="hero">
<h2>Level Up Your Game</h2>
<p>Play • Stream • Win</p>
<button onclick="alert('Welcome Gamer! 🔥')">Start Gaming</button>
</section>

<section class="cards">

<div class="card">
<h2>🔥 FPS Games</h2>
<p>Valorant, CS2, PUBG</p>
</div>

<div class="card">
<h2>⚔️ Battle Royale</h2>
<p>Fortnite, Apex Legends</p>
</div>

<div class="card">
<h2>🏆 Esports</h2>
<p>Tournaments & Live Matches</p>
</div>

</section>

<footer>
<p>© 2026 OG Gamer | Made with ❤️</p>
</footer>

</body>
</html>
